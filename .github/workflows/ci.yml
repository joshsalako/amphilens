name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and quality tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[cli,web]" pytest pytest-cov pillow python-dotenv httpx2 ruff build

      - name: Check import without optional ML/UI runtimes
        run: python -c "import amphilens; print(amphilens.__version__)"

      - name: Run tests with coverage
        run: python -m pytest --cov=amphilens --cov-report=term-missing

      - name: Lint
        run: ruff check src tests

      - name: Build wheel and source distribution
        run: python -m build
