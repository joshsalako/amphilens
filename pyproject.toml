[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "amphilens"
version = "0.1.0"
description = "Reproducible amphibian and wildlife camera-trap detection with active learning."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "AmphiLens contributors" }]
dependencies = []

[project.optional-dependencies]
cli = [
  "typer>=0.12",
  "rich>=13.7",
]
ui = [
  "streamlit>=1.36",
]
inference = [
  "numpy>=1.24",
  "pillow>=10.0",
  "torch>=2.2",
  "torchvision>=0.17",
  "ultralytics>=8.2",
]
training = [
  "amphilens[inference]",
  "pyyaml>=6.0",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]
all = [
  "amphilens[cli,ui,inference,training]",
]

[project.scripts]
amphilens = "amphilens.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/amphilens"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

