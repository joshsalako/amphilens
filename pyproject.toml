[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "amphilens"
version = "0.1.0a1"
description = "Reproducible amphibian and wildlife camera-trap detection with active learning."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
authors = [{ name = "AmphiLens contributors" }]
dependencies = []

[project.optional-dependencies]
cli = [
  "typer>=0.12",
  "rich>=13.7",
]
web = [
  "python-dotenv>=1.0",
  "starlette>=1.0",
  "uvicorn>=0.30",
]
inference = [
  "numpy>=1.24",
  "opencv-python-headless>=4.10",
  "pillow>=10.0",
  "torch>=2.2",
  "torchvision>=0.17",
  "ultralytics>=8.2",
  "huggingface-hub>=0.30",
]
training = [
  "amphilens[inference]",
  "pyyaml>=6.0",
]
cvat = [
  "cvat-cli==2.76.0",
  "cvat-sdk==2.76.0",
  "python-dotenv>=1.0",
]
cloud = [
  "modal>=1.4.3,<2",
  "pillow>=10.0",
  "python-dotenv>=1.0",
]
cloud-azure = [
  "azure-ai-ml>=1.22,<2",
  "azure-identity>=1.17,<2",
  "azure-storage-blob>=12.20,<13",
]
cloud-gcp = [
  "google-cloud-aiplatform>=1.70,<2",
  "google-cloud-storage>=2.18,<4",
]
ocr = [
  "onnxruntime>=1.18",
  "opencv-python-headless>=4.10",
  "rapidocr>=3.6.0",
]
dev = [
  "amphilens[cli,web,inference]",
  "python-dotenv>=1.0",
  "httpx2",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]
release = [
  "build>=1.2",
  "twine>=5.1",
]
all = [
  "amphilens[cli,web,inference,training,cvat,cloud,cloud-azure,cloud-gcp,ocr,release]",
]

[project.scripts]
amphilens = "amphilens.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/amphilens"]

[tool.hatch.build.targets.wheel.force-include]
"src/amphilens/models/amphilens-models.json" = "amphilens/models/amphilens-models.json"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/test_cli.py" = ["E402"]
